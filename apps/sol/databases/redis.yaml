apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    group: databases
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 25.3.10
    helm:
      values: |
        fullnameOverride: redis
        architecture: standalone
        auth:
          existingSecret: database-credentials
          existingSecretPasswordKey: REDIS_PASSWORD
        master:
          # Override the chart's default "nano" preset (150m CPU limit), which throttled
          # this hard enough to make Infisical's dashboard take seconds per request.
          # No CPU limit: let it burst on the idle node.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          persistence:
            enabled: true
            size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
