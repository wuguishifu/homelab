apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    group: databases
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 25.3.10
    helm:
      values: |
        fullnameOverride: redis
        architecture: standalone
        auth:
          existingSecret: database-credentials
          existingSecretPasswordKey: REDIS_PASSWORD
        master:
          # Override the chart's default "nano" preset (150m CPU limit), which throttled
          # this hard enough to make Infisical's dashboard take seconds per request.
          # No CPU limit: let it burst on the idle node.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          persistence:
            enabled: true
            size: 2Gi
        extraDeploy:
          # Exposes Redis on sol's Tailscale IP via k3s ServiceLB, so off-cluster hosts (the mini)
          # reach it as redis.wuguishifu.dev:6379; pods resolve that name to redis-master instead
          # (manifests/coredns-config). ServiceLB binds every interface (LAN too), so only tailnet
          # clients are accepted. A separate Service rather than master.service.type because the
          # chart can't disable NodePorts, which kube-proxy opens to the LAN unfiltered.
          - apiVersion: v1
            kind: Service
            metadata:
              name: redis-tailnet
              namespace: databases
            spec:
              type: LoadBalancer
              allocateLoadBalancerNodePorts: false
              loadBalancerSourceRanges:
                - 100.64.0.0/10
                # Tailscale on sol SNATs forwarded tailnet traffic (snat-subnet-routes), so it
                # reaches the ServiceLB pod from sol's cni0 address, not the client's 100.x IP.
                # LAN traffic isn't SNATed and keeps its 10.21.x source, so it's still dropped.
                - 10.42.0.1/32
              selector:
                app.kubernetes.io/name: redis
                app.kubernetes.io/instance: redis
                app.kubernetes.io/component: master
              ports:
                - name: tcp-redis
                  port: 6379
                  targetPort: redis
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
