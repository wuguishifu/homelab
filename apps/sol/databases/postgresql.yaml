apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  labels:
    group: databases
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 18.5.16
    helm:
      values: |
        fullnameOverride: postgresql
        auth:
          username: infisical
          database: infisicalDB
          existingSecret: database-credentials
          secretKeys:
            adminPasswordKey: POSTGRES_ADMIN_PASSWORD
            userPasswordKey: POSTGRES_PASSWORD
        primary:
          # Override the chart's default "nano" preset (150m CPU limit), which throttled
          # this hard enough to make Infisical's dashboard take seconds per request.
          # No CPU limit: let it burst on the idle node.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          persistence:
            enabled: true
            size: 8Gi
        extraDeploy:
          # Exposes PostgreSQL on sol's Tailscale IP via k3s ServiceLB, so off-cluster clients reach
          # it as postgres.wuguishifu.dev:5432; pods resolve that name to the postgresql Service
          # instead (manifests/coredns-config). Same pattern and caveats as redis-tailnet in redis.yaml.
          - apiVersion: v1
            kind: Service
            metadata:
              name: postgresql-tailnet
              namespace: databases
            spec:
              type: LoadBalancer
              allocateLoadBalancerNodePorts: false
              loadBalancerSourceRanges:
                - 100.64.0.0/10
                # Tailscale on sol SNATs forwarded tailnet traffic to sol's cni0 address (see redis.yaml).
                - 10.42.0.1/32
              selector:
                app.kubernetes.io/name: postgresql
                app.kubernetes.io/instance: postgresql
                app.kubernetes.io/component: primary
              ports:
                - name: tcp-postgresql
                  port: 5432
                  targetPort: tcp-postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
