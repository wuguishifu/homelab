apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: janktm-service
  namespace: argocd
  labels:
    group: homelab
  annotations:
    # With the other universe services. It needs the ffmpeg worker on the mini (hosts/mini) to make
    # anything, but scans and the API work without it.
    argocd.argoproj.io/sync-wave: "5"
    argocd-image-updater.argoproj.io/image-list: "service=ghcr.io/wuguishifu/universe/janktm-service:latest"
    argocd-image-updater.argoproj.io/service.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-secret
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wuguishifu/homelab.git
    targetRevision: HEAD
    path: manifests/janktm-service
  destination:
    server: https://kubernetes.default.svc
    namespace: janktm-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
