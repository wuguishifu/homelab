apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-tools
  namespace: argocd
  labels:
    group: homelab
  annotations:
    # Before the apps that mount its binaries (jankbot-stitcher, in wave 4).
    argocd.argoproj.io/sync-wave: "3"
    argocd-image-updater.argoproj.io/image-list: "tools=ghcr.io/wuguishifu/media-tools:latest"
    argocd-image-updater.argoproj.io/tools.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-secret
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wuguishifu/homelab.git
    targetRevision: HEAD
    path: manifests/media-tools
  destination:
    server: https://kubernetes.default.svc
    namespace: media-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
