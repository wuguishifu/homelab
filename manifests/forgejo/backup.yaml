# Nightly, but it only uploads a repository whose refs changed since its last backup, so each
# repository gets a new backup within a day of a push and none otherwise (backup.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup
  namespace: forgejo
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # For pg_dump; backup.sh adds git, age and aws-cli.
              image: postgres:18-alpine
              command: ["sh", "/scripts/backup.sh"]
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-secrets
                      key: DB_PASSWORD
              envFrom:
                - configMapRef:
                    name: forgejo-backup-config
                # S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, AGE_RECIPIENT
                - secretRef:
                    name: forgejo-backup-secrets
              volumeMounts:
                # Same node as Forgejo (sol is the only one), so the ReadWriteOnce PVC can be shared.
                - name: data
                  mountPath: /var/lib/gitea
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: forgejo-data
            - name: scripts
              configMap:
                name: forgejo-backup-script
            # One repository's bundle at a time.
            - name: work
              emptyDir: {}
