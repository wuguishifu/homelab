apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # No authelia-forwardauth middleware: git can't follow a browser login. The web UI logs in
    # through Authelia over OIDC instead (README.md).
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.wuguishifu.dev
      secretName: forgejo-tls
  rules:
    - host: git.wuguishifu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  number: 3000
