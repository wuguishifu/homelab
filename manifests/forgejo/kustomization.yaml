apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup.yaml
configMapGenerator:
  - name: forgejo-backup-script
    namespace: forgejo
    files:
      - backup.sh
  - name: forgejo-backup-config
    namespace: forgejo
    literals:
      - REPO_ROOT=/var/lib/gitea/git/repositories
      - DB_HOST=postgresql.databases.svc.cluster.local
      # Production Garage on the NAS (GARAGE.md).
      - S3_ENDPOINT=https://s3.wuguishifu.dev
      - S3_REGION=garage
      - S3_BUCKET=forgejo-backups
      - KEEP_REPO_BACKUPS=5
      - KEEP_DB_BACKUPS=7
