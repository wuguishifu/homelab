# Tailnet only, like everything on *.wuguishifu.dev. The app has no login of its own; Authelia's
# forward-auth below is it. A Cloudflare Tunnel route to the Service would skip Traefik and so the
# login, so a public route has to go through Traefik (or Cloudflare Access).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thermo-automation
  namespace: thermo-automation
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Authelia login in front (manifests/authelia/middleware.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - thermo.wuguishifu.dev
      secretName: thermo-automation-tls
  rules:
    - host: thermo.wuguishifu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thermo-automation
                port:
                  number: 80
