# In-cluster: http://thermo-automation.thermo-automation.svc.cluster.local. From the tailnet, use the
# Ingress (https://thermo.wuguishifu.dev).
apiVersion: v1
kind: Service
metadata:
  name: thermo-automation
  namespace: thermo-automation
spec:
  selector:
    app: thermo-automation
  ports:
    - name: http
      port: 80
      targetPort: 3009
      protocol: TCP
