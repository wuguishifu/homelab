# In-cluster address for tungsten, which runs natively on the Mac mini (hosts/mini), not in k3s.
# Pods call http://tungsten.tungsten.svc.cluster.local as if it were an ordinary Service; when
# tungsten moves (another host, or back into the cluster), only the EndpointSlice changes.
#
# No selector: the endpoints are listed by hand in endpointslice.yaml.
apiVersion: v1
kind: Service
metadata:
  name: tungsten
  namespace: tungsten
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3002
      protocol: TCP
