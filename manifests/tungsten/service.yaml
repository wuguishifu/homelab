# In-cluster address for tungsten, which runs natively on the Mac mini (hosts/mini), not in k3s.
# Pods call http://tungsten.tungsten.svc.cluster.local; the tungsten-proxy Deployment forwards
# to the mini. When tungsten moves (another host, or back into the cluster), only the proxy's
# target in configmap.yaml changes.
apiVersion: v1
kind: Service
metadata:
  name: tungsten
  namespace: tungsten
spec:
  selector:
    app: tungsten-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
