# Whisper model files, filled by the worker's fetch-models init container (see configmap.yaml).
# local-path storage lives on the node's disk, so only workers on this node can mount it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tungsten-models
  namespace: tungsten
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
