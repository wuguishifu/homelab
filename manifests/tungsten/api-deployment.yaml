# HTTP API: validates requests and hands them to the worker through Redis. Lightweight and
# stateless, so it can be scaled or restarted without touching transcriptions in progress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tungsten
  namespace: tungsten
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tungsten
      component: api
  template:
    metadata:
      labels:
        app: tungsten
        component: api
    spec:
      containers:
        - name: tungsten
          image: ghcr.io/wuguishifu/universe/tungsten:latest
          env:
            - name: ENVIRONMENT
              value: production
            - name: TUNGSTEN_ROLE
              value: api
          envFrom:
            - secretRef:
                name: tungsten-secrets
            - configMapRef:
                name: tungsten-env
          ports:
            - containerPort: 3002
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Inline audio is up to ~13MB per request as JSON.
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
