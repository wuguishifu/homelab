apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Both Deployments use the same image, so Image Updater's digest override (written to
# .argocd-source-tungsten.yaml) always rolls the api and worker to the same version.
resources:
  - configmap.yaml
  - pvc.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
