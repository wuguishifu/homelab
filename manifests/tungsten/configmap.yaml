apiVersion: v1
kind: ConfigMap
metadata:
  name: tungsten-proxy
  namespace: tungsten
data:
  default.conf: |
    # Forwards in-cluster requests to tungsten on the Mac mini's Tailscale IP (bos-mac-mini).
    # Pods can reach tailnet IPs through sol's Tailscale interface but can't resolve MagicDNS
    # names, so this is an IP; it only changes if the mini is re-added to the tailnet
    # (check with `tailscale ip -4 bos-mac-mini`).
    log_format tungsten '$remote_addr "$request" $status ${body_bytes_sent}B '
                        'in ${request_time}s (upstream ${upstream_response_time}s)';

    server {
      listen 8080;
      access_log /dev/stdout tungsten;

      # Inline audio is up to ~13MB once base64-encoded as JSON.
      client_max_body_size 16m;

      # Liveness: nginx itself is up, whether or not the mini is.
      location = /proxy-health {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        proxy_pass http://100.81.149.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # tungsten holds synchronous transcriptions open for up to 60s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
      }
    }
