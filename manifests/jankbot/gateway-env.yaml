# Non-secret settings shared by every gateway. Per-gateway settings (ROLE, NAME) are on each
# Deployment; secrets come from Infisical (see README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jankbot-gateway-env
  namespace: jankbot
data:
  # The in-cluster analytics-service.
  ANALYTICS_SERVICE_BASE_URL: "http://analytics-service.analytics-service.svc.cluster.local"
  DEBUG_LOGGING: "true"
