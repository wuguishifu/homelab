apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    replication_factor = 1

    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.wuguishifu.dev"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.wuguishifu.dev"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
