apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redash
  namespace: redash
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - redash.wuguishifu.dev
      secretName: redash-tls
  rules:
    - host: redash.wuguishifu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redash
                port:
                  number: 80
