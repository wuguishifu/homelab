apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redash
  namespace: redash
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Authelia login in front (manifests/authelia/middleware.yaml); see REDASH_REMOTE_USER_*.
    traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - redash.wuguishifu.dev
      secretName: redash-tls
  rules:
    - host: redash.wuguishifu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redash
                port:
                  number: 80
