# Applies the universe monorepo's drizzle migrations (platform/postgres/utils) to the universe
# database. This is a regular resource rather than a Sync hook: ArgoCD doesn't diff hooks, so an
# app made only of one always looks Synced and auto-sync never runs it. As a tracked resource, a new
# image digest from Image Updater makes the app OutOfSync, and since a Job's pod template is
# immutable, Replace + Force delete and recreate it. The app is also only Healthy once the Job has
# completed, which is what holds back the wave-5 apps that use the database. Re-running is safe:
# drizzle skips applied migrations, and the script holds an advisory lock while it migrates.
apiVersion: batch/v1
kind: Job
metadata:
  name: universe-db-migrate
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  # No ttlSecondsAfterFinished: if the Job were cleaned up, ArgoCD would see it missing and re-run
  # it. The completed Job and its logs stay until the next image replaces it.
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/wuguishifu/universe/universe-db-migrations:latest
          env:
            # The Bitnami chart runs without TLS.
            - name: UNIVERSE_DB_SSL
              value: "false"
          envFrom:
            # UNIVERSE_DB_CONNECTION_STRING for the universe role; see README.md.
            - secretRef:
                name: universe-db-migrator-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
