# In-cluster address for transcription-service, which runs natively on the Mac mini (hosts/mini),
# not in k3s. Pods call http://transcription-service.transcription-service.svc.cluster.local; the
# transcription-service-proxy Deployment forwards to the mini. When it moves (another host, or
# back into the cluster), only the proxy's target in configmap.yaml changes.
apiVersion: v1
kind: Service
metadata:
  name: transcription-service
  namespace: transcription-service
spec:
  selector:
    app: transcription-service-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
