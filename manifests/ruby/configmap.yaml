# Non-secret settings. Secrets (Discord token, Redis, Convex, transcription-service token)
# come from Infisical via ruby-secrets; see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ruby-env
  namespace: ruby
data:
  # The in-cluster interface to transcription-service on the Mac mini
  # (manifests/transcription-service).
  TRANSCRIPTION_SERVICE_URL: "http://transcription-service.transcription-service.svc.cluster.local"
  # Empty: register slash commands globally rather than to dev servers.
  DISCORD_DEV_GUILD_IDS: ""
  # Logs every captured clip and transcript. Useful while bringing ruby up; set to "false" once
  # it's settled.
  DEBUG_LOGGING: "true"
