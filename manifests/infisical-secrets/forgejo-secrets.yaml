# SECRET_KEY and DB_PASSWORD for Forgejo; see manifests/forgejo/README.md.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: forgejo-secrets
  namespace: infisical-operator-system
spec:
  hostAPI: https://infisical.wuguishifu.dev/api
  syncConfig:
    resyncInterval: 60s

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator-system
      secretsScope:
        projectSlug: homelab
        envSlug: prod
        secretsPath: /forgejo
        recursive: false

  managedSecretReference:
    secretName: forgejo-secrets
    secretNamespace: forgejo
    secretType: Opaque
