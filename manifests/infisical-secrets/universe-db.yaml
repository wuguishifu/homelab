# Migration credentials for the universe database; see manifests/universe-db/README.md.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: universe-db-migrator-secrets
  namespace: infisical-operator-system
spec:
  hostAPI: https://infisical.wuguishifu.dev/api
  syncConfig:
    resyncInterval: 60s

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator-system
      secretsScope:
        projectSlug: universe
        envSlug: prod
        secretsPath: /platform/postgres
        recursive: false

  managedSecretReference:
    secretName: universe-db-migrator-secrets
    secretNamespace: databases
    secretType: Opaque
