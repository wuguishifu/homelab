# clipper-service's secrets, one per Infisical path in the app's secretsPaths
# (universe projects/clipper/service/environment-config.json), plus prod Convex's. The shared /platform/* groups are
# synced into this namespace rather than copied into the app's own path; see
# manifests/clipper-service/README.md.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: clipper-service-gemini
  namespace: infisical-operator-system
spec:
  hostAPI: https://infisical.wuguishifu.dev/api
  syncConfig:
    resyncInterval: 60s

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator-system
      secretsScope:
        projectSlug: universe
        envSlug: prod
        secretsPath: /platform/gemini
        recursive: false

  managedSecretReference:
    secretName: clipper-service-gemini
    secretNamespace: clipper-service
    secretType: Opaque
