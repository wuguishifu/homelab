# jankbot's secrets; see manifests/jankbot/README.md for what goes in each path.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: jankbot-core-secrets
  namespace: infisical-operator-system
spec:
  hostAPI: https://infisical.wuguishifu.dev/api
  syncConfig:
    resyncInterval: 60s

  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator-system
      secretsScope:
        projectSlug: universe
        envSlug: prod
        secretsPath: /projects/jankbot/core
        recursive: false

  managedSecretReference:
    secretName: jankbot-core-secrets
    secretNamespace: jankbot
    secretType: Opaque
---
# Shared by every gateway. Not recursive, so the per-bot folders below it stay separate.
