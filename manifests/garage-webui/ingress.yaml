apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-webui
  namespace: garage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Authelia login in front (manifests/authelia/middleware.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - garage-dev.wuguishifu.dev
      secretName: garage-webui-tls
  rules:
    - host: garage-dev.wuguishifu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-webui
                port:
                  number: 80
