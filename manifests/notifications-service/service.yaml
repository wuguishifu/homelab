# In-cluster: http://notifications-service.notifications-service.svc.cluster.local. From the
# tailnet, use the Ingress (https://notifications.wuguishifu.dev).
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: notifications-service
spec:
  selector:
    app: notifications-service
  ports:
    - name: http
      port: 80
      targetPort: 3011
      protocol: TCP
